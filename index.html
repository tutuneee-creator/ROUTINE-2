<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROUTINE-2 TEST | YT-DREAMDOSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0a0f2b;
    --navy2:#141c47;
    --indigo:#1d2761;
    --gold:#f2b705;
    --amber:#ff7a29;
    --green:#2fd48a;
    --red:#ff4d5e;
    --cream:#f6f1e4;
    --dim:#aab0d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(242,183,5,0.18), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(255,122,41,0.12), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%);
    color:var(--cream);
    font-family:'Hind', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:40px;
  }
  .watermark{
    width:100%;
    text-align:center;
    background:linear-gradient(90deg, var(--amber), var(--gold));
    color:#1a1200;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
    padding:10px 12px;
    font-size:clamp(13px, 2.6vw, 18px);
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
    position:sticky;
    top:0;
    z-index:50;
    text-transform:uppercase;
  }
  .wrap{
    width:100%;
    max-width:720px;
    padding:20px 16px 0;
  }
  /* ---------- START SCREEN ---------- */
  .hero{
    text-align:center;
    padding:36px 10px 10px;
  }
  .hero h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 7vw, 44px);
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--gold), var(--amber));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(242,183,5,0.25);
  }
  .hero p{color:var(--dim); font-size:16px; margin:4px 0;}
  .badge-row{
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:18px 0 26px;
  }
  .pill{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(242,183,5,0.35);
    color:var(--cream);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
  }
  .name-input{
    width:100%;
    max-width:340px;
    margin:0 auto 18px;
    display:block;
    padding:14px 16px;
    border-radius:12px;
    border:2px solid rgba(242,183,5,0.4);
    background:rgba(255,255,255,0.05);
    color:var(--cream);
    font-size:16px;
    font-family:'Hind', sans-serif;
    text-align:center;
  }
  .name-input::placeholder{color:var(--dim);}
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:#1a1200;
    background:linear-gradient(90deg, var(--gold), var(--amber));
    border:none;
    padding:15px 34px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(255,122,41,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 14px 34px rgba(255,122,41,0.45);}
  .btn:active{transform:translateY(0px) scale(0.98);}
  .btn.secondary{
    background:rgba(255,255,255,0.08);
    color:var(--cream);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:none;
  }
  .center{text-align:center;}

  /* ---------- QUIZ SCREEN ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin:14px 0 6px; gap:10px; flex-wrap:wrap;
  }
  .progress-wrap{flex:1; min-width:160px;}
  .progress-label{font-size:12px; color:var(--dim); margin-bottom:5px; display:flex; justify-content:space-between;}
  .progress-track{
    height:8px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--gold), var(--amber));
    border-radius:6px; transition:width .3s ease;
  }
  .score-box{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    background:rgba(47,212,138,0.12);
    border:1px solid rgba(47,212,138,0.4);
    color:var(--green);
    padding:8px 14px;
    border-radius:12px;
    font-size:14px;
    white-space:nowrap;
  }

  .timer-ring{
    width:66px; height:66px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:6px auto 2px;
    position:relative;
    background:conic-gradient(var(--gold) calc(var(--pct,100)*1%), rgba(255,255,255,0.08) 0);
    transition:background .25s linear;
  }
  .timer-ring.warn{background:conic-gradient(var(--red) calc(var(--pct,100)*1%), rgba(255,255,255,0.08) 0);}
  .timer-ring::before{
    content:'';
    position:absolute; inset:6px;
    border-radius:50%;
    background:var(--navy2);
  }
  .timer-num{
    position:relative; z-index:2;
    font-family:'Baloo 2', sans-serif;
    font-weight:800; font-size:22px;
  }
  .timer-num.warn{color:var(--red);}

  .tagline{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(18px,4.6vw,24px);
    color:var(--gold);
    margin:10px 0 2px;
    letter-spacing:0.3px;
  }
  .motivate{
    text-align:center;
    color:var(--dim);
    font-size:14px;
    margin:0 0 16px;
    font-style:italic;
  }

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px solid rgba(242,183,5,0.25);
    border-radius:20px;
    padding:22px 20px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .qnum{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:#1a1200;
    background:var(--gold);
    padding:3px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
  }
  .q-en{font-size:17px; font-weight:600; line-height:1.5; margin:0 0 6px;}
  .q-hi{font-size:16px; color:var(--dim); line-height:1.6; margin:0 0 18px;}

  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left;
    background:rgba(255,255,255,0.045);
    border:2px solid rgba(255,255,255,0.12);
    color:var(--cream);
    padding:13px 16px;
    border-radius:12px;
    font-size:15px;
    cursor:pointer;
    font-family:'Hind', sans-serif;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    display:flex; gap:10px; align-items:flex-start;
  }
  .opt:hover{border-color:rgba(242,183,5,0.6); background:rgba(242,183,5,0.08);}
  .opt .k{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    background:rgba(255,255,255,0.1);
    min-width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0;
  }
  .opt.correct{
    border-color:var(--green); background:rgba(47,212,138,0.15);
  }
  .opt.correct .k{background:var(--green); color:#08351f;}
  .opt.wrong{
    border-color:var(--red); background:rgba(255,77,94,0.15);
  }
  .opt.wrong .k{background:var(--red); color:#3a0509;}
  .opt.disabled{cursor:default;}
  .opt.faded{opacity:0.45;}

  .feedback{
    margin-top:18px;
    padding:16px 16px;
    border-radius:14px;
    animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(0.96); opacity:0;} to{transform:scale(1); opacity:1;}}
  .feedback.correct{background:rgba(47,212,138,0.12); border:1px solid rgba(47,212,138,0.4);}
  .feedback.wrong{background:rgba(255,77,94,0.12); border:1px solid rgba(255,77,94,0.4);}
  .feedback h3{
    margin:0 0 8px; font-family:'Baloo 2', sans-serif; font-size:20px;
  }
  .feedback.correct h3{color:var(--green);}
  .feedback.wrong h3{color:var(--red);}
  .feedback p{margin:4px 0; font-size:14px; line-height:1.55; color:var(--cream);}
  .feedback .tip{color:var(--gold); font-weight:600; margin-top:8px;}

  .next-row{display:flex; justify-content:center; margin-top:18px;}

  /* ---------- SCOREBOARD ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,8,26,0.85);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:16px;
    backdrop-filter:blur(3px);
  }
  .board{
    background:linear-gradient(180deg, var(--indigo), var(--navy2));
    border:2px solid var(--gold);
    border-radius:22px;
    padding:30px 26px;
    max-width:420px; width:100%;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
  }
  .board h2{
    font-family:'Baloo 2', sans-serif; color:var(--gold); font-size:24px; margin:0 0 16px;
  }
  .board .stat-row{display:flex; justify-content:space-around; margin:18px 0;}
  .stat{display:flex; flex-direction:column; gap:4px;}
  .stat .num{font-family:'Baloo 2', sans-serif; font-size:28px; font-weight:800;}
  .stat .lbl{font-size:12px; color:var(--dim);}
  .stat.ok .num{color:var(--green);}
  .stat.no .num{color:var(--red);}
  .stat.acc .num{color:var(--gold);}
  .board .comment{font-size:15px; margin:14px 0 20px; color:var(--cream);}

  /* ---------- FINAL SCREEN ---------- */
  .final h2{
    font-family:'Baloo 2', sans-serif; font-size:clamp(24px,6vw,32px);
    color:var(--gold); margin-bottom:6px;
  }
  .final .grade{
    font-family:'Baloo 2', sans-serif; font-size:48px; font-weight:800; margin:14px 0;
    background:linear-gradient(90deg, var(--gold), var(--amber));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  footer{
    margin-top:30px; color:var(--dim); font-size:12px; text-align:center; padding:0 16px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>

  hi:"आंग्ल-फ्रांसीसी संघर्ष (कर्नाटक युद्ध) के संदर्भ में निम्नलिखित कथनों पर विचार कीजिए:\n1. प्रथम कर्नाटक युद्ध की समाप्ति 'ऐ-ला-शापेल की संधि' (1748) से हुई, जिसके तहत अंग्रेजों को मद्रास वापस मिल गया।\n2. द्वितीय कर्नाटक युद्ध में फ्रांसीसी गवर्नर डुप्ले ने पहली बार 'भारतीय शासकों के आंतरिक विवादों में भाग लेने' की नीति अपनाई ताकि फ्रांसीसी प्रभाव बढ़ाया जा सके।\n3. तृतीय कर्नाटक युद्ध के दौरान 1760 में वांडीवाश के युद्ध में फ्रांसीसियों की अंतिम पराजय हुई और ब्रिटिश वर्चस्व स्थापित हो गया।",

  en:"Regarding the Portuguese Empire in India, consider the following statements:\n1. Francisco de Almeida started the 'Blue Water Policy' to establish Portuguese naval supremacy in the Indian Ocean.\n2. Afonso de Albuquerque captured Goa from the Sultan of Bijapur in 1510, which later became the main centre of Portuguese power in India.",

  correct:2,

  exp_hi:"दोनों कथन पुर्तगाली नौसैनिक रणनीति और गोवा विजय का सही वर्णन करते हैं।"
},
{
  en:"Regarding the Dutch East India Company in India, consider the following statements:\n1. The Dutch established their first permanent commercial factory in 1605 at Masulipatnam on the Coromandel coast.\n2. After a decisive defeat in the 'Battle of Bedara' (1759) against the English, Dutch commercial and political ambitions in India ended completely.",
  hi:"भारत में डच ईस्ट इंडिया कंपनी के संबंध में निम्नलिखित कथनों पर विचार कीजिए:\n1. डचों ने 1605 में कोरोमंडल तट पर स्थित मसूलीपट्नम में अपनी पहली स्थायी व्यावसायिक फैक्ट्री स्थापित की थी।\n2. 1759 में अंग्रेजों के साथ हुए 'बेदरा के युद्ध' में निर्णायक हार के बाद भारत में डचों की व्यावसायिक और राजनीतिक महत्वाकांक्षाएं पूरी तरह समाप्त हो गईं।",

  ],

const TAGLINES = [
  "🔥 BRAIN BLAST!",
  "🧠 CAN YOU CRACK IT?",
  "🎯 EXAM TRAP!",
  "🚨 DON'T FALL FOR THE TRAP!",
  "🏆 BOSS LEVEL!"
];
const MOTIVATE = [
  "ध्यान से सोचिए… इसमें एक ट्रैप है! 👀",
  "जवाब लॉक करने से पहले अच्छी तरह सोच लें! 🔒",
  "जल्दबाजी न करें—हर विकल्प ध्यान से पढ़ें! 🎯",
  "आपकी मेहनत रंग लाएगी—फोकस बनाए रखें! 💪",
  "एक-एक अंक मायने रखता है, ध्यान से चुनें! ⭐"
];

const TOTAL_TIME = 30;
let state = {
  idx:0, score:0, correctCount:0, wrongCount:0,
  answered:false, timer:null, timeLeft:TOTAL_TIME, name:""
};

const app = document.getElementById('app');

function shuffleTag(arr, i){ return arr[i % arr.length]; }

function renderStart(){
  app.innerHTML = `
    <div class="hero">
      <h1>ROUTINE-2 TEST</h1>
      <p>Bilingual Game-Show Quiz · 30 Questions · Bihar Police & Competitive Exam Prep</p>
      <div class="badge-row">
        <span class="pill">⏱️ 30 sec / question</span>
        <span class="pill">🌐 English + हिंदी</span>
        <span class="pill">🏆 Live Scoreboard</span>
      </div>
      <input id="nameInput" class="name-input" placeholder="अपना नाम लिखें (optional)" maxlength="24">
      <div><button class="btn" id="startBtn">🚀 Start Quiz / क्विज़ शुरू करें</button></div>
    </div>
  `;
  document.getElementById('startBtn').onclick = ()=>{
    state.name = document.getElementById('nameInput').value.trim();
    state = {...state, idx:0, score:0, correctCount:0, wrongCount:0};
    renderQuestion();
  };
}

function renderQuestion(){
  clearInterval(state.timer);
  state.answered = false;
  state.timeLeft = TOTAL_TIME;
  const q = QUESTIONS[state.idx];
  const qn = state.idx + 1;
  const pct = Math.round((state.idx/QUESTIONS.length)*100);

  let matchHtml = "";
  if(q.matchTable){
    matchHtml = `<div style="display:flex; gap:14px; flex-wrap:wrap; margin:6px 0 16px;">
      <div style="flex:1; min-width:130px;">
        ${q.matchTable.left.map(l=>`<div style="padding:6px 0; font-size:14px; border-bottom:1px dashed rgba(255,255,255,0.12);">${l}</div>`).join('')}
      </div>
      <div style="flex:1; min-width:150px;">
        ${q.matchTable.right.map(r=>`<div style="padding:6px 0; font-size:14px; border-bottom:1px dashed rgba(255,255,255,0.12);">${r}</div>`).join('')}
      </div>
    </div>`;
  }

  app.innerHTML = `
    <div class="topbar">
      <div class="progress-wrap">
        <div class="progress-label"><span>Q${qn} / ${QUESTIONS.length}</span><span>${pct}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="score-box">🏅 ${state.score} pts</div>
    </div>
    <div class="timer-ring" id="ring" style="--pct:100">
      <div class="timer-num" id="timerNum">${TOTAL_TIME}</div>
    </div>
    <div class="tagline">${shuffleTag(TAGLINES, state.idx)}</div>
    <div class="motivate">${shuffleTag(MOTIVATE, state.idx)}</div>
    <div class="card">
      <span class="qnum">Q${qn}</span>
      <p class="q-en">${q.en.replace(/\n/g,'<br>')}</p>
      <p class="q-hi">${q.hi.replace(/\n/g,'<br>')}</p>
      ${matchHtml}
      <div class="options" id="optionsBox">
        ${q.options.map((o,i)=>`
          <button class="opt" data-i="${i}">
            <span class="k">${String.fromCharCode(65+i)}</span>
            <span>${o.en} <span style="color:var(--dim);">/ ${o.hi}</span></span>
          </button>
        `).join('')}
      </div>
      <div id="feedbackBox"></div>
      <div class="next-row" id="nextRow"></div>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=> selectAnswer(parseInt(btn.dataset.i));
  });

  startTimer();
}

function startTimer(){
  const ring = document.getElementById('ring');
  const num = document.getElementById('timerNum');
  state.timer = setInterval(()=>{
    state.timeLeft--;
    const pct = Math.max(0, Math.round((state.timeLeft/TOTAL_TIME)*100));
    ring.style.setProperty('--pct', pct);
    num.textContent = state.timeLeft;
    if(state.timeLeft <= 8){
      ring.classList.add('warn'); num.classList.add('warn');
    }
    if(state.timeLeft <= 0){
      clearInterval(state.timer);
      if(!state.answered) selectAnswer(-1); // time's up, no answer
    }
  }, 1000);
}

function selectAnswer(choice){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timer);
  const q = QUESTIONS[state.idx];
  const isCorrect = choice === q.correct;

  document.querySelectorAll('.opt').forEach((btn,i)=>{
    btn.classList.add('disabled');
    if(i === q.correct) btn.classList.add('correct');
    else if(i === choice) btn.classList.add('wrong');
    else btn.classList.add('faded');
    btn.onclick = null;
  });

  const fb = document.getElementById('feedbackBox');
  if(isCorrect){
    state.score += 10;
    state.correctCount++;
    fb.innerHTML = `
      <div class="feedback correct">
        <h3>🎉 CORRECT! 🔥</h3>
        <p><b>Why?</b> ${q.exp_en}</p>
        <p>${q.exp_hi}</p>
      </div>`;
  } else {
    state.wrongCount++;
    const correctOpt = q.options[q.correct];
    fb.innerHTML = `
      <div class="feedback wrong">
        <h3>${choice===-1 ? "⏰ TIME'S UP!" : "❌ NOT QUITE!"}</h3>
        <p>🏆 <b>Correct Answer:</b> ${String.fromCharCode(65+q.correct)} — ${correctOpt.en} / ${correctOpt.hi}</p>
        <p>📚 <b>Why?</b> ${q.exp_en}</p>
        <p>${q.exp_hi}</p>
      </div>`;
  }

  const nextRow = document.getElementById('nextRow');
  const isLast = state.idx === QUESTIONS.length - 1;
  nextRow.innerHTML = `<button class="btn" id="nextBtn">${isLast ? '🏁 Finish Quiz' : '➡️ Next Question'}</button>`;
  document.getElementById('nextBtn').onclick = ()=>{
    if((state.idx+1) % 5 === 0){
      showScoreboard(isLast);
    } else if(isLast){
      renderFinal();
    } else {
      state.idx++;
      renderQuestion();
    }
  };
}

function showScoreboard(isLast){
  const total = state.correctCount + state.wrongCount;
  const acc = total ? Math.round((state.correctCount/total)*100) : 0;
  let comment;
  if(acc >= 80) comment = "🔥 You're on fire! Keep the momentum going!";
  else if(acc >= 50) comment = "⚡ Solid progress! The traps are getting harder — stay sharp!";
  else comment = "💪 Tough round! Time to fight back on the next set!";

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="board">
      <h2>🏆 QUIZ SCOREBOARD</h2>
      <div class="stat-row">
        <div class="stat ok"><div class="num">${state.correctCount}</div><div class="lbl">✅ Correct</div></div>
        <div class="stat no"><div class="num">${state.wrongCount}</div><div class="lbl">❌ Incorrect</div></div>
        <div class="stat acc"><div class="num">${acc}%</div><div class="lbl">🎯 Accuracy</div></div>
      </div>
      <p class="comment">${comment}</p>
      <button class="btn" id="continueBtn">${isLast ? '🏁 See Final Result' : 'Continue ➡️'}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('continueBtn').onclick = ()=>{
    overlay.remove();
    if(isLast){
      renderFinal();
    } else {
      state.idx++;
      renderQuestion();
    }
  };
}

function renderFinal(){
  const total = QUESTIONS.length;
  const acc = Math.round((state.correctCount/total)*100);
  let grade, gmsg;
  if(acc >= 85){grade="🏆 TOPPER"; gmsg="बेहतरीन! आप परीक्षा के लिए पूरी तरह तैयार हैं!";}
  else if(acc >= 65){grade="🥈 STRONG"; gmsg="बहुत अच्छा प्रदर्शन! थोड़ी और प्रैक्टिस से टॉप पर पहुँचेंगे।";}
  else if(acc >= 40){grade="🥉 GROWING"; gmsg="अच्छी शुरुआत! कमजोर टॉपिक्स पर दोबारा फोकस करें।";}
  else {grade="📘 KEEP GOING"; gmsg="निराश मत होइए—रिवीजन करें और दोबारा अटेम्प्ट करें!";}

  app.innerHTML = `
    <div class="hero final">
      <h2>🎬 QUIZ COMPLETE!</h2>
      <p style="color:var(--dim);">${state.name ? state.name + ', y' : 'Y'}our final results are in</p>
      <div class="grade">${grade}</div>
      <div class="stat-row" style="max-width:360px; margin:0 auto;">
        <div class="stat ok"><div class="num">${state.correctCount}</div><div class="lbl">✅ Correct</div></div>
        <div class="stat no"><div class="num">${state.wrongCount}</div><div class="lbl">❌ Incorrect</div></div>
        <div class="stat acc"><div class="num">${acc}%</div><div class="lbl">🎯 Accuracy</div></div>
      </div>
      <p style="margin-top:14px; font-size:16px;">🏅 Total Score: <b style="color:var(--gold);">${state.score} pts</b></p>
      <p style="color:var(--cream); max-width:420px; margin:14px auto;">${gmsg}</p>
      <button class="btn" id="restartBtn">🔄 Restart Quiz / फिर से शुरू करें</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = renderStart;
}

renderStart();
</script>
</body>
</html>
